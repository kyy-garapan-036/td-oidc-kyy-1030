name: td-oidc-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token and call ToDesktop
        run: |
          set -eu
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=todesktop" | jq -r .value)
          echo "len:" $(printf %s "$TOKEN" | wc -c)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -r ".aud, .repository, .ref, .event_name" || true
          STATUS=$(curl -sS -o resp.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" https://updates.todesktop.com/v2/ci/261020b3s331a/token)
          echo "status=$STATUS"
          cat resp.txt
