name: td-oidc-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange ToDesktop OIDC
        run: |
          set -eu
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=todesktop" | jq -r .value)
          echo "oidc_len=${#TOKEN}"
          STATUS=$(curl -sS -o resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${TOKEN}" https://updates.todesktop.com/v2/ci/261020b3s331a/token)
          echo "status=$STATUS"
          cat resp.json
